<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Mindset Daily — Calm Cadence wordmark</title>
  <desc id="desc">A lowercase, text-only Mindset Daily logo with a deliberate cadence.</desc>
  <rect width="1080" height="1080" fill="#FFFFFF"/>
  <!-- The repeated letter spacing makes the second line feel like a daily rhythm. -->
  <text x="540" y="490" text-anchor="middle" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="158" font-weight="400" letter-spacing="-9">mindset</text>
  <text x="540" y="640" text-anchor="middle" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="27">daily</text>
</svg>
