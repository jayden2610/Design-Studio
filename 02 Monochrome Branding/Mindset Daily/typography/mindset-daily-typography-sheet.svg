<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Mindset Daily typography logo directions</title>
  <desc id="desc">Three pure typography logo concepts on white.</desc>
  <rect width="1800" height="1200" fill="#F7F7F5"/>
  <text x="100" y="115" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="8">MINDSET DAILY</text>
  <text x="100" y="165" fill="#111111" font-family="Georgia, serif" font-size="37">Pure typography directions for TikTok</text>
  <g transform="translate(100 270)">
    <rect width="480" height="750" rx="18" fill="#FFFFFF"/>
    <text x="42" y="62" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="4">01 / BOLD STACK</text>
    <text x="240" y="345" text-anchor="middle" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-4">MINDSET</text>
    <text x="240" y="425" text-anchor="middle" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="75" font-weight="800" letter-spacing="3">DAILY</text>
    <text x="42" y="650" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="20">Strongest small-size read.</text>
    <text x="42" y="682" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="20">Direct and energetic.</text>
  </g>
  <g transform="translate(660 270)">
    <rect width="480" height="750" rx="18" fill="#FFFFFF"/>
    <text x="42" y="62" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="4">02 / EDITORIAL CONTRAST</text>
    <text x="240" y="345" text-anchor="middle" fill="#111111" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-6">Mindset</text>
    <text x="240" y="421" text-anchor="middle" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="12">DAILY</text>
    <text x="42" y="650" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="20">Thoughtful and elevated.</text>
    <text x="42" y="682" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="20">Best for reflective content.</text>
  </g>
  <g transform="translate(1220 270)">
    <rect width="480" height="750" rx="18" fill="#FFFFFF"/>
    <text x="42" y="62" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="4">03 / CALM CADENCE</text>
    <text x="240" y="345" text-anchor="middle" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="400" letter-spacing="-5">mindset</text>
    <text x="240" y="421" text-anchor="middle" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" letter-spacing="14">daily</text>
    <text x="42" y="650" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="20">Softest and most modern.</text>
    <text x="42" y="682" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="20">Works for quieter material.</text>
  </g>
</svg>
