<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Mindset Daily minimal TikTok logo concepts</title>
  <desc id="desc">Three monochrome logo directions on white: Editorial Pulse, Daily Reset, and Focus Frame.</desc>
  <rect width="1800" height="1200" fill="#F7F7F5"/>
  <text x="100" y="115" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="8">MINDSET DAILY</text>
  <text x="100" y="165" fill="#111111" font-family="Georgia, serif" font-size="37">TikTok profile-logo directions</text>
  <g transform="translate(100 270)">
