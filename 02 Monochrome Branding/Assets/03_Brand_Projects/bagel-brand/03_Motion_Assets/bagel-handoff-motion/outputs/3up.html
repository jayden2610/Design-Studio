<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bagel Handoff — 3up compare</title>
<style>
  body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif;padding:24px}
  h1{font-size:16px;font-weight:600;margin:0 0 20px}
  .row{display:flex;gap:16px}
  .cell{flex:1;min-width:0}
  .cell h2{font-size:13px;font-weight:500;margin:0 0 8px;color:#aaa}
  video{width:100%;background:#000;display:block}
  button{margin-top:10px;padding:6px 14px;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<h1>Bagel Handoff Motion — 3 candidates</h1>
<div class="row">
  <div class="cell">
    <h2>component handoff (13:45)</h2>
    <video id="v1" src="http://localhost:8090/bagel-component-handoff-motion/Bagel%20Handoff%20-%20component%20handoff.mp4" controls loop></video>
  </div>
  <div class="cell">
    <h2>controlled motion (13:30)</h2>
    <video id="v2" src="http://localhost:8090/bagel-controlled-motion/Bagel%20Handoff%20-%20controlled%20motion.mp4" controls loop></video>
  </div>
  <div class="cell">
    <h2>wrapper smooth HQ (13:22)</h2>
    <video id="v3" src="http://localhost:8090/bagel-wrapper-smooth-hq/Bagel%20Handoff%20-%20Oil%20Motion%20smooth%20HQ.mp4" controls loop></video>
  </div>
</div>
<button id="playall">Play all 3 together</button>
<script>
document.getElementById('playall').onclick = () => {
  ['v1','v2','v3'].forEach(id => { const v = document.getElementById(id); v.currentTime = 0; v.play(); });
};
</script>
</body>
</html>
