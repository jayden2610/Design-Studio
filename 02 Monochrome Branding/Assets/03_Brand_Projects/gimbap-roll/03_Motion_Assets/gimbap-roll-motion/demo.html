<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gimbap roll</title>
    <style>
      :root { color-scheme: light; --paper: #f3efe6; --ink: #161616; }
      * { box-sizing: border-box; }
      html { background: var(--paper); }
      body { margin: 0; min-height: 420vh; overflow-x: hidden; background: var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
      .scroll-track { height: 420vh; }
      .stage { position: fixed; inset: 0; z-index: 1; display: grid; place-items: end center; padding: 0 clamp(24px, 5vw, 72px) clamp(64px, 8vh, 100px); overflow: hidden; pointer-events: none; }
      .canvas-wrap { width: min(76vw, 900px); aspect-ratio: 16 / 9; display: grid; place-items: center; }
      canvas { display: block; width: 100%; height: 100%; }
      .copy { position: fixed; inset: 0; z-index: 2; padding: clamp(24px, 5vw, 72px); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
      .page-title { margin: 0; font-size: clamp(18px, 2.4vw, 32px); line-height: 1; letter-spacing: -.045em; text-align: center; white-space: nowrap; font-weight: 400; }
      @media (max-width: 640px) { .stage { padding-bottom: 64px; } .canvas-wrap { width: min(82vw, 420px); } .page-title { font-size: 22px; } }
      @media (prefers-reduced-motion: reduce) { body { min-height: 100vh; } .scroll-track { height: 100vh; } }
    </style>
  </head>
  <body>
    <main class="scroll-track" aria-label="gimbap roll keyframe study">
      <section class="stage">
        <div class="canvas-wrap"><canvas id="motion" aria-label="gimbap roll illustration"></canvas></div>
      </section>
      <div class="copy">
        <h1 class="page-title">gimbap roll</h1>
      </div>
    </main>
    <script>
      (() => {
        const canvas = document.getElementById('motion');
        const ctx = canvas.getContext('2d', { alpha: true });
        const paths = ["final/keyframes-alpha/K0.png", "final/keyframes-alpha/K1.png", "final/keyframes-alpha/K2.png", "final/keyframes-alpha/K3.png"];
        const images = paths.map((src) => { const image = new Image(); image.src = src; return image; });
        let loaded = 0, current = -1, queued = false, progress = 0;
        const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const fit = () => {
          const rect = canvas.getBoundingClientRect();
          const dpr = Math.min(devicePixelRatio || 1, 2);
          canvas.width = Math.round(rect.width * dpr); canvas.height = Math.round(rect.height * dpr);
          current = -1;
          draw(Math.round(progress * (images.length - 1)));
        };
        const draw = (frame) => {
          if (!images[frame] || !images[frame].complete || !images[frame].naturalWidth) return;
          if (frame === current && canvas.width) return;
          current = frame;
          const image = images[frame], scale = Math.min(canvas.width / image.naturalWidth, canvas.height / image.naturalHeight);
          const x = (canvas.width - image.naturalWidth * scale) / 2, y = (canvas.height - image.naturalHeight * scale) / 2;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(image, x, y, image.naturalWidth * scale, image.naturalHeight * scale);
        };
        const update = () => {
          queued = false;
          const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
          progress = prefersReduced ? 1 : Math.max(0, Math.min(1, scrollY / max));
          draw(Math.round(progress * (images.length - 1)));
        };
        const queue = () => { if (!queued) { queued = true; requestAnimationFrame(update); } };
        images.forEach((image) => {
          image.addEventListener('load', () => { loaded += 1; if (loaded === images.length) { fit(); update(); } });
          image.addEventListener('error', () => console.error('Keyframe failed to load:', image.src));
        });
        addEventListener('scroll', queue, { passive: true });
        addEventListener('resize', fit, { passive: true });
        fit(); update();
      })();
    </script>
  </body>
</html>
