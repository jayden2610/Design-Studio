<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>coffee bag</title>
    <style>
      :root { color-scheme: light; --paper: #f3efe6; --ink: #161616; }
      * { box-sizing: border-box; }
      html { background: var(--paper); }
      body { margin: 0; min-height: 720vh; overflow-x: hidden; background: var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
      .scroll-track { height: 720vh; }
      .stage { position: fixed; inset: 0; z-index: 1; display: grid; place-items: end center; padding: 0 clamp(24px, 5vw, 72px) clamp(48px, 7vh, 88px); overflow: hidden; pointer-events: none; }
      .canvas-wrap { width: min(68vw, 700px); aspect-ratio: 1440 / 2176; display: grid; place-items: center; }
      .motion-source { display: none; }
      .motion-canvas, .motion-fallback { grid-area: 1 / 1; display: block; width: 100%; height: 100%; object-fit: contain; }
      .motion-canvas[hidden], .motion-fallback[hidden] { display: none; }
      .copy { position: fixed; inset: 0; z-index: 2; padding: clamp(24px, 5vw, 72px); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
      .page-title { margin: 0; font-size: clamp(18px, 2.4vw, 32px); line-height: 1; letter-spacing: -.045em; text-align: center; white-space: nowrap; font-weight: 400; }
      @media (max-width: 640px) { .stage { padding-bottom: 48px; } .canvas-wrap { width: min(82vw, 430px); } .page-title { font-size: 22px; } }
      @media (prefers-reduced-motion: reduce) { body, .scroll-track { min-height: 100vh; height: 100vh; } }
    </style>
  </head>
  <body>
    <main class="scroll-track" aria-label="coffee bag product flipbook">
      <section class="stage"><div class="canvas-wrap"><img class="motion-fallback" src="final/chroma-video/poster-alpha.png" alt="open coffee bag with beans" /><video class="motion-source" muted playsinline preload="auto" src="final/chroma-video/coffee-bag-motion-chroma.mp4"></video><canvas class="motion-canvas" aria-label="coffee bag opening and revealing coffee beans"></canvas></div></section>
      <div class="copy"><h1 class="page-title">coffee bag</h1></div>
    </main>
    <script src="chroma-scroll.js"></script>
  </body>
</html>
