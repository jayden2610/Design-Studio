<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gimbap Roll — 01 / The Opening</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,500&display=swap');
  :root {
    --rice:#F0EBDC; --ink:#1C1F1B; --chilli:#C2451F; --muted:#6B6F63;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1920px; height:1080px; }
  body { display:flex; background:var(--rice); color:var(--ink); font-family:'Archivo',sans-serif; }
  .panel {
    width:960px; height:1080px; padding:72px 84px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .kicker {
    display:flex; align-items:center; gap:18px;
    font-size:15px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--chilli);
  }
  .kicker .dot { width:16px; height:16px; border-radius:50%; background:var(--chilli); }
  .center { margin-bottom:40px; }
  h1 {
    font-size:148px; font-weight:800; line-height:.92; letter-spacing:-.03em;
    color:var(--ink); margin-bottom:56px;
  }
  .lede {
    font-size:27px; font-weight:500; line-height:1.5; letter-spacing:-.01em;
    max-width:460px; color:var(--ink);
  }
  .foot {
    font-size:14px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  }
  .photo { width:960px; height:1080px; }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; }
</style>
</head>
<body>
  <section class="panel">
    <div class="kicker">01 / The Opening <span class="dot"></span></div>
    <div class="center">
      <h1>Gimbap<br>Roll.</h1>
      <p class="lede">A lunch counter built to make the midday feel more considered.</p>
    </div>
    <div class="foot">Gimbap Roll / Sidewalk Sign</div>
  </section>
  <section class="photo">
    <img src="assets/aframe-sign.png" alt="Gimbap Roll A-frame sidewalk sign" />
  </section>
</body>
</html>
