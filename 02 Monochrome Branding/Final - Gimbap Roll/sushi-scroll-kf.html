<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gimbap Roll — Scrollable Sushi (Keyframes)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Playfair+Display:ital,wght@1,500&display=swap');
  :root {
    --rice:#F0EBDC; --ink:#1C1F1B; --chilli:#C2451F; --muted:#6B6F63; --line:#CFC8B4;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:auto; }
  body { background:var(--rice); color:var(--ink); font-family:'Archivo',sans-serif; }

  .intro, .outro {
    min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:24px; text-align:center; padding:48px;
  }
  .intro .kicker, .outro .kicker { font-size:13px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--chilli); }
  .intro h1 { font-size:clamp(56px,9vw,128px); font-weight:800; letter-spacing:-.03em; line-height:.92; }
  .intro p, .outro p { font-family:'Playfair Display',serif; font-style:italic; font-size:clamp(18px,2.2vw,26px); color:var(--muted); max-width:560px; }

  #scene { height:100vh; position:relative; overflow:hidden; background:var(--rice); }
  .frame { position:absolute; inset:0; opacity:0; will-change:transform,opacity; }
  .frame img { display:block; width:100%; height:100%; object-fit:contain; }

  .hud { position:absolute; left:0; right:0; padding:40px 56px; display:flex; justify-content:space-between; align-items:baseline; font-size:13px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; pointer-events:none; }
  .hud .brand { color:var(--chilli); }
  .hud .stage { color:var(--muted); overflow:hidden; }
  .hud .stage span { display:inline-block; }
  .hint { position:absolute; bottom:36px; left:50%; transform:translateX(-50%); font-size:12px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); pointer-events:none; }
  .progress-rail { position:absolute; bottom:0; left:0; right:0; height:4px; display:flex; }
  .tick { flex:1; background:rgba(28,31,27,.08); position:relative; overflow:hidden; margin-right:4px; }
  .tick:last-child { margin-right:0; }
  .tick i { position:absolute; inset:0; background:var(--chilli); transform:scaleX(0); transform-origin:left center; }
</style>
</head>
<body>

  <section class="intro">
    <div class="kicker">Gimbap Roll — Brand Identity</div>
    <h1>Roll with<br>the scroll.</h1>
    <p>One hand. One mat. One perfect roll — cut fresh across your scrollbar.</p>
  </section>

  <section id="scene">
    <div class="frame" id="f0"><img src="final/keyframes-alpha/K0.png" alt="Empty bamboo mat"></div>
    <div class="frame" id="f1"><img src="final/keyframes-alpha/K1.png" alt="Hand pressing the roll"></div>
    <div class="frame" id="f2"><img src="final/keyframes-alpha/K2.png" alt="Mat wrapped around the roll"></div>
    <div class="frame" id="f3"><img src="final/keyframes-alpha/K3.png" alt="Finished roll with cut piece"></div>

    <div class="hud"><span class="brand">Gimbap Roll</span><span class="stage"><span id="stageLabel">01 — The Mat</span></span></div>
    <div class="hint" id="hint">Scroll to roll ↓</div>
    <div class="progress-rail">
      <div class="tick"><i></i></div>
      <div class="tick"><i></i></div>
      <div class="tick"><i></i></div>
      <div class="tick"><i></i></div>
    </div>
  </section>

  <section class="outro">
    <div class="kicker">Rolled fresh</div>
    <p>Rolled fresh. Ready when you are.</p>
  </section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const ids = ['f0','f1','f2','f3'];
const frames = ids.map(id => document.getElementById(id));
const ticks = document.querySelectorAll('.tick i');
const stageLabel = document.getElementById('stageLabel');
const hint = document.getElementById('hint');
const pfillWrap = document.querySelector('.progress-rail');

const STOPS = [0, 0.15, 0.45, 0.75, 1];
const SNAP_POINTS = [0.075, 0.30, 0.60, 0.875, 1];
const SNAP_RADIUS = 0.06;
function snapTarget(value){
  let best = SNAP_POINTS[0];
  for (const pt of SNAP_POINTS){
    if (Math.abs(pt - value) < Math.abs(best - value)) best = pt;
  }
  return Math.abs(best - value) <= SNAP_RADIUS ? best : value;
}
const LABELS = ['01 — The Mat', '02 — The Press', '03 — The Wrap', '04 — The Roll'];

const ADJUST = [
  { x: 0, y: 18, s: 1.17 },
  { x: 0, y: 0, s: 1 },
  { x: 0, y: 0, s: 1 },
  { x: 0, y: 0, s: 1 },
];

const ACCENT = [
  null,
  { dScale: 0.02, dRot: 0 },
  { dScale: 0.008, dRot: -3 },
  { dScale: 0.03, dRot: 0 },
];

const clamp = gsap.utils.clamp(0, 1);
const easeOut = gsap.parseEase('power2.out');
window.__kfRender = p => render(clamp(p));

let seg = { idx: 0, remain: 1 };
let punch = 0;
let lastIdx = -1;
let animateLabel = true;

function segmentOf(p){
  for (let i = 3; i >= 0; i--){
    if (p >= STOPS[i]) return { idx: i, span: STOPS[i + 1] - STOPS[i], start: STOPS[i] };
  }
  return { idx: 0, span: STOPS[1], start: 0 };
}

function setStage(idx){
  if (idx === lastIdx) return;
  lastIdx = idx;
  stageLabel.textContent = LABELS[idx];
  if (animateLabel) gsap.fromTo(stageLabel, { yPercent: 110 }, { yPercent: 0, duration: 0.45, ease: 'power3.out' });
}

function render(p){
  const { idx, span, start } = segmentOf(p);
  const lp = clamp((p - start) / span);
  const k = easeOut(clamp(lp / 0.35));
  const remain = 1 - k;

  frames.forEach((f, i) => {
    f.style.opacity = i === idx ? '1' : '0';
  });

  seg = { idx, remain };
  setStage(idx);

  ticks.forEach((t, i) => {
    const fill = clamp((p - STOPS[i]) / (STOPS[i + 1] - STOPS[i]));
    t.style.transform = `scaleX(${fill.toFixed(3)})`;
  });

  hint.style.opacity = String(clamp(1 - p * 30));
}

gsap.ticker.add(() => {
  punch *= 0.88;
  const t = performance.now() / 1000;
  const f = frames[seg.idx];
  if (!f || f.style.opacity !== '1') return;
  const a = ADJUST[seg.idx];
  const acc = ACCENT[seg.idx] || { dScale: 0, dRot: 0 };
  const breathe = 1 + 0.006 * Math.sin(t * 1.6);
  const sway = 0.3 * Math.sin(t * 0.9 + seg.idx * 1.7);
  const s = a.s * (1 + acc.dScale * seg.remain + punch) * breathe;
  const r = (acc.dRot * seg.remain + sway).toFixed(2);
  f.style.transform = `translate(${a.x}%, ${a.y}%) scale(${s.toFixed(4)}) rotate(${r}deg)`;
});

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const debugP = /^#p=/.test(location.hash) ? parseFloat(location.hash.slice(3)) : null;

if (debugP !== null && !Number.isNaN(debugP)) {
  document.querySelector('.intro').style.display = 'none';
  document.querySelector('.outro').style.display = 'none';
  animateLabel = false;
  gsap.ticker.sleep();
  render(debugP);
} else if (reduced) {
  animateLabel = false;
  gsap.ticker.sleep();
  render(1);
} else {
  ScrollTrigger.create({
    trigger: '#scene',
    start: 'top top',
    end: '+=2500',
    pin: true,
    scrub: 1,
    anticipatePin: 1,
    snap: {
      snapTo: snapTarget,
      duration: { min: 0.15, max: 0.35 },
      delay: 0.12,
      ease: 'power2.inOut'
    },
    onUpdate: self => {
      punch = Math.min(0.03, Math.abs(self.getVelocity()) / 40000);
      render(self.progress);
    }
  });
  render(0);
}
</script>
</body>
</html>
