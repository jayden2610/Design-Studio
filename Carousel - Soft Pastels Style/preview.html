<!DOCTYPE html>
<html lang="en">

<title>Photo Journal Carousel — Preview</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #2a2a2a; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px 0; }
.slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; flex-shrink: 0; }
.slide .bg { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
.overlay { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
.block { position: absolute; border-radius: 30px; }
.star { position: absolute; }
.star svg { width: 100%; height: 100%; }
.heart { position: absolute; font-size: 25px; }

/* Slide 1 */
.s1 .block1 { width: 780px; height: 320px; left: 150px; top: 480px; background: rgba(248,200,220,0.55); border-radius: 30px; }
.s1 .label { position: absolute; left: 100px; top: 90px; font-family: Montserrat; font-weight: 600; font-size: 13px; color: #FFF9F0; letter-spacing: 4px; }
.s1 .headline { position: absolute; left: 50%; transform: translateX(-50%); top: 510px; font-family: Poppins; font-weight: 700; font-size: 72px; color: #FFF9F0; line-height: 0.9; text-align: center; width: 780px; }
.s1 .accent { position: absolute; left: 50%; transform: translateX(-50%); top: 830px; font-family: 'Dancing Script'; font-size: 32px; color: #F8C8DC; }
.s1 .s1 { top: 460px; left: 180px; width: 35px; height: 35px; }
.s1 .s2 { top: 440px; left: 830px; width: 45px; height: 45px; }
.s1 .s3 { top: 800px; left: 320px; width: 28px; height: 28px; }
.s1 .s4 { top: 800px; left: 720px; width: 30px; height: 30px; }
.s1 .s5 { top: 510px; left: 900px; width: 22px; height: 22px; }
.s1 .heart1 { top: 70px; left: 300px; color: rgba(248,200,220,0.4); }

/* Slide 2 */
.s2 .gradient { position: absolute; bottom: 0; left: 0; width: 1080px; height: 400px; background: linear-gradient(to top, rgba(58,46,42,0.7), rgba(58,46,42,0)); }
.s2 .headline { position: absolute; right: 120px; bottom: 230px; font-family: Poppins; font-weight: 700; font-size: 64px; color: #FFF9F0; text-align: right; }
.s2 .accent { position: absolute; right: 120px; bottom: 170px; font-family: 'Dancing Script'; font-size: 26px; color: #B8C4A8; }
.s2 .s1 { bottom: 290px; right: 520px; width: 28px; height: 28px; }
.s2 .s2 { bottom: 180px; right: 440px; width: 22px; height: 22px; }
.s2 .s3 { bottom: 240px; right: 200px; width: 20px; height: 20px; }

/* Slide 3 */

.s3 .headline { position: absolute; left: 160px; top: 550px; font-family: Poppins; font-weight: 700; font-size: 66px; color: #F8C8DC; }
.s3 .accent { position: absolute; left: 160px; top: 645px; font-family: 'Dancing Script'; font-size: 24px; color: #D8C8E8; }
.s3 .s1 { top: 500px; left: 120px; width: 30px; height: 30px; }
.s3 .s2 { top: 710px; left: 480px; width: 25px; height: 25px; }
.s3 .s3 { top: 530px; left: 660px; width: 22px; height: 22px; }

/* Slide 4 */

.s4 .headline { position: absolute; left: 50%; transform: translateX(-50%); top: 975px; font-family: Poppins; font-weight: 700; font-size: 68px; color: #FFF9F0; text-align: center; width: 700px; }
.s4 .accent { position: absolute; left: 50%; transform: translateX(-50%); top: 1065px; font-family: 'Dancing Script'; font-size: 26px; color: #F8C8DC; text-align: center; width: 700px; }
.s4 .s1 { top: 940px; left: 240px; width: 35px; height: 35px; }
.s4 .s2 { top: 920px; left: 780px; width: 45px; height: 45px; }
.s4 .s3 { top: 1100px; left: 340px; width: 28px; height: 28px; }
.s4 .s4s { top: 1100px; left: 700px; width: 30px; height: 30px; }
.s4 .s5s { top: 980px; left: 600px; width: 22px; height: 22px; }

/* Slide 5 */
.s5 .dim { position: absolute; width: 1080px; height: 1350px; top: 0; left: 0; background: rgba(58,46,42,0.45); }
.s5 .block5 { width: 700px; height: 300px; left: 190px; top: 525px; background: #FFF9F0; border-radius: 30px; box-shadow: 0 8px 40px rgba(216,200,232,0.2); }
.s5 .headline { position: absolute; left: 50%; transform: translateX(-50%); top: 580px; font-family: Poppins; font-weight: 700; font-size: 52px; color: #F8C8DC; text-align: center; width: 700px; }
.s5 .accent { position: absolute; left: 50%; transform: translateX(-50%); top: 670px; font-family: Montserrat; font-weight: 300; font-size: 16px; color: #B8C4A8; text-align: center; width: 700px; }
.s5 .s1 { top: 480px; left: 250px; width: 35px; height: 35px; }
.s5 .s2 { top: 780px; left: 750px; width: 30px; height: 30px; }
.s5 .s3 { top: 790px; left: 320px; width: 25px; height: 25px; }

.s5 .heart1 { top: 565px; left: 560px; color: rgba(216,200,232,0.6); }

/* Page indicators */
.slide-label { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #FFF9F0; padding: 8px 24px; border-radius: 20px; font-family: Montserrat; font-size: 14px; z-index: 10; letter-spacing: 2px; }
</style>
<script>
let currentSlide = 0;
const totalSlides = 5;
function scrollToSlide() {
  const slides = document.querySelectorAll('.slide');
  const label = document.getElementById('slideLabel');
  if (currentSlide >= 0 && currentSlide < totalSlides) {
    slides[currentSlide].scrollIntoView({ behavior: 'smooth', block: 'start' });
    const names = ['SLIDE 1 — COVER','SLIDE 2 — MORNING','SLIDE 3 — COZY','SLIDE 4 — GOLDEN HOUR','SLIDE 5 — CTA'];
    label.textContent = names[currentSlide] + '  (' + (currentSlide+1) + '/' + totalSlides + ')';
  }
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); currentSlide = Math.min(currentSlide + 1, totalSlides - 1); scrollToSlide(); }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); currentSlide = Math.max(currentSlide - 1, 0); scrollToSlide(); }
});
window.addEventListener('load', () => {
  const label = document.getElementById('slideLabel');
  label.textContent = 'SLIDE 1 — COVER  (1/5)';
});
</script>
</head>
