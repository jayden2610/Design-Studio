<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habits That Changed My Life — Reverse-Engineered</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&family=Montserrat:wght@600&family=Dancing+Script:wght@400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #2a2a2a; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px 0; }
.slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; flex-shrink: 0; }
.slide .bg { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
.block { position: absolute; border-radius: 20px; }
.pill { position: absolute; border-radius: 6px; display: flex; align-items: center; gap: 6px; }
.star { position: absolute; }
.star svg { width: 100%; height: 100%; }

/* ====== SLIDE 1: TITLE ====== */
/* Left-aligned: large white block, green "save" pill at bottom-left, photo full-bleed */
.s1 .b1 { width: 680px; height: 200px; left: 80px; top: 200px; background: rgba(255,255,255,0.88); border-radius: 20px; }
.s1 .b2 { position: absolute; left: 80px; top: 370px; background: rgba(184,196,168,0.9); border-radius: 5px; padding: 6px 16px; }
.s1 .h-main { position: absolute; left: 110px; top: 215px; font-family: Poppins; font-weight: 800; font-size: 52px; color: #3A2E2A; line-height: 1.1; width: 620px; }
.s1 .h-sub { position: absolute; left: 96px; top: 370px; font-family: Poppins; font-weight: 400; font-size: 16px; color: #FFF9F0; }
.s1 .save-pill { position: absolute; bottom: 120px; left: 80px; background: #B8C4A8; border-radius: 8px; padding: 14px 24px; display: flex; align-items: center; gap: 8px; }
.s1 .save-pill span { font-family: Montserrat; font-weight: 600; font-size: 15px; color: #FFF9F0; }
.s1 .save-pill svg { width: 18px; height: 18px; }
.s1 .s1 { top: 180px; right: 140px; width: 55px; height: 55px; }
.s1 .s2 { bottom: 200px; right: 100px; width: 40px; height: 40px; }
.s1 .s3 { top: 430px; left: 200px; width: 30px; height: 30px; }

/* ====== SLIDE 2: INTERIOR — centered white block on photo ====== */
.s2 .b1 { width: 620px; height: 140px; left: 230px; top: 580px; background: rgba(255,255,255,0.88); border-radius: 20px; }
.s2 .h { position: absolute; left: 50%; transform: translateX(-50%); top: 600px; font-family: Poppins; font-weight: 700; font-size: 48px; color: #3A2E2A; text-align: center; width: 560px; }
.s2 .h-sub { position: absolute; left: 50%; transform: translateX(-50%); top: 670px; font-family: Poppins; font-weight: 400; font-size: 18px; color: #8A8070; text-align: center; width: 500px; }
.s2 .folder { position: absolute; top: 60px; right: 100px; }
.s2 .folder div { background: rgba(248,200,220,0.85); border-radius: 4px; padding: 5px 10px; font-family: Montserrat; font-weight: 600; font-size: 11px; color: #FFF9F0; letter-spacing: 1px; }
.s2 .s1 { top: 560px; left: 300px; width: 35px; height: 35px; }
.s2 .s2 { top: 700px; left: 680px; width: 28px; height: 28px; }

/* ====== SLIDE 3: INTERIOR — sage/green rounded block centered ====== */
.s3 .b1 { width: 700px; height: 120px; left: 190px; top: 620px; background: rgba(184,196,168,0.82); border-radius: 20px; }
.s3 .h { position: absolute; left: 50%; transform: translateX(-50%); top: 640px; font-family: Poppins; font-weight: 700; font-size: 46px; color: #FFF9F0; text-align: center; width: 640px; }
.s3 .s1 { top: 600px; left: 250px; width: 35px; height: 35px; }
.s3 .s2 { top: 720px; left: 720px; width: 28px; height: 28px; }
.s3 .s3 { top: 590px; left: 720px; width: 22px; height: 22px; }

/* ====== SLIDE 4: INTERIOR — floating text, no block ====== */
.s4 .h { position: absolute; left: 80px; bottom: 280px; font-family: Poppins; font-weight: 700; font-size: 52px; color: #FFF9F0; text-shadow: 0 3px 20px rgba(0,0,0,0.3); width: 800px; line-height: 1.1; }
.s4 .h-sub { position: absolute; left: 80px; bottom: 220px; font-family: Poppins; font-weight: 400; font-size: 20px; color: rgba(255,255,255,0.8); text-shadow: 0 2px 12px rgba(0,0,0,0.3); }
.s4 .s1 { bottom: 340px; left: 60px; width: 40px; height: 40px; }
.s4 .s2 { bottom: 340px; right: 280px; width: 30px; height: 30px; }

/* ====== SLIDE 5: CTA — green rounded block, left-aligned ====== */
.s5 .b1 { width: 540px; height: 160px; left: 80px; bottom: 180px; background: rgba(184,196,168,0.92); border-radius: 20px; }
.s5 .h { position: absolute; left: 120px; bottom: 270px; font-family: Poppins; font-weight: 800; font-size: 46px; color: #FFF9F0; }
.s5 .h-sub { position: absolute; left: 130px; bottom: 225px; font-family: Poppins; font-weight: 400; font-size: 18px; color: rgba(255,249,240,0.85); }
.s5 .bookmark { position: absolute; left: 120px; bottom: 215px; display: flex; align-items: center; gap: 6px; }
.s5 .s1 { bottom: 360px; left: 60px; width: 35px; height: 35px; }
.s5 .s2 { bottom: 180px; right: 90px; width: 30px; height: 30px; }
.s5 .s3 { bottom: 150px; left: 450px; width: 25px; height: 25px; }

/* Navigation */
.slide-label { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: #FFF9F0; padding: 8px 24px; border-radius: 20px; font-family: Montserrat; font-size: 13px; z-index: 10; letter-spacing: 2px; }
</style>
<script>
let currentSlide = 0;
const totalSlides = 5;
function scrollToSlide() {
  const slides = document.querySelectorAll('.slide');
  const label = document.getElementById('slideLabel');
  if (currentSlide >= 0 && currentSlide < totalSlides) {
    slides[currentSlide].scrollIntoView({ behavior: 'smooth', block: 'start' });
    const names = ['SLIDE 1 — TITLE','SLIDE 2 — MORNING RITUAL','SLIDE 3 — COZY MOMENT','SLIDE 4 — GOLDEN HOUR','SLIDE 5 — CTA'];
    label.textContent = names[currentSlide] + '  (' + (currentSlide+1) + '/' + totalSlides + ')';
  }
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); currentSlide = Math.min(currentSlide + 1, totalSlides - 1); scrollToSlide(); }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); currentSlide = Math.max(currentSlide - 1, 0); scrollToSlide(); }
});
window.addEventListener('load', () => {
  document.getElementById('slideLabel').textContent = 'SLIDE 1 — TITLE  (1/5)';
});
</script>
</head>
<body>

<div class="slide-label" id="slideLabel">SLIDE 1 — TITLE  (1/5)</div>

  </div>

  <div class="star s2"><svg viewBox="0 0 100 100"><polygon points="50,5 58,35 90,35 63,55 72,88 50,65 28,88 37,55 10,35 42,35" fill="rgba(255,249,240,0.55)"/></svg></div>
  <div class="star s3"><svg viewBox="0 0 100 100"><polygon points="50,5 58,35 90,35 63,55 72,88 50,65 28,88 37,55 10,35 42,35" fill="rgba(184,196,168,0.65)"/></svg></div>

  <div class="star s2"><svg viewBox="0 0 100 100"><polygon points="50,5 58,35 90,35 63,55 72,88 50,65 28,88 37,55 10,35 42,35" fill="rgba(255,249,240,0.6)"/></svg></div>

  <div class="star s3"><svg viewBox="0 0 100 100"><polygon points="50,5 58,35 90,35 63,55 72,88 50,65 28,88 37,55 10,35 42,35" fill="rgba(255,249,240,0.65)"/></svg></div>
