<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>31 Little Prompts — Cut-out Editorial Moodboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page" data-document-role="page" data-label="Cut-out editorial moodboard cover">
      <div class="grain" aria-hidden="true"></div>

      <img class="sticker flowers" src="../../01 Source Assets/stickers/dried-flowers-outlined.png" alt="Dried flower bouquet">
      <img class="sticker flats" src="../../01 Source Assets/stickers/08-ballet-flats-outlined.png" alt="Ballet flats">
      <img class="sticker sunglasses" src="../../01 Source Assets/stickers/sunglasses-outlined.png" alt="Sunglasses">
      <img class="sticker mirror" src="../../01 Source Assets/stickers/10-hand-mirror-outlined.png" alt="Hand mirror">
      <img class="sticker bag" src="../../01 Source Assets/stickers/tote-bag-outlined.png" alt="Tote bag">
      <img class="sticker coffee" src="../../01 Source Assets/stickers/iced-coffee-outlined.png" alt="Iced coffee">
      <img class="sticker lipstick" src="../../01 Source Assets/stickers/lipstick-outlined.png" alt="Lipstick">
      <img class="sticker book" src="../../01 Source Assets/stickers/open-book-outlined.png" alt="Open book">
      <img class="sticker clip" src="../../01 Source Assets/stickers/09-hair-clip-outlined.png" alt="Hair clip">
      <img class="sticker tape" src="../../01 Source Assets/stickers/04 iOS Photo Diary Additions/25-transparent-tape-strip.png" alt="Transparent tape">
      <img class="sticker underline" src="../../01 Source Assets/stickers/04 iOS Photo Diary Additions/28-hand-drawn-underline.png" alt="Hand-drawn underline">

      <figure class="memory-photo">
        <img src="../../01 Source Assets/lifestyle-ugc/03-pack1-portrait-turned.png" alt="Lifestyle portrait placeholder">
        <figcaption>a slow morning, saved</figcaption>
      </figure>

      <section class="headline" aria-label="Cover title">
        <p class="eyebrow">journal notes · vol. 01</p>
        <h1><span>3 journal</span><em>prompts</em><span>for when you feel stuck</span></h1>
        <p class="subhead">swipe for a softer way back to yourself</p>
      </section>

      <aside class="paper-note" aria-label="Handmade paper note">
        <span>make</span>
        <strong>time<br>for<br>you</strong>
      </aside>

      <div class="sparkle sparkle-one" aria-hidden="true">✦</div>
      <div class="sparkle sparkle-two" aria-hidden="true">✧</div>
      <div class="page-number">01 / 01</div>
    </main>
  </body>
</html>
