<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel Style Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0c;
    color: #e8e8ed;
    font-family: 'Inter', sans-serif;
    padding: 2.5rem 1rem 4rem;
  }

  header { max-width: 1200px; margin: 0 auto 2.5rem; text-align: center; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 700; margin-bottom: 0.4rem; }
  header p { color: #8a8a98; font-size: 0.95rem; }

  .gallery {
    max-width: 500px;
    margin: 0 auto;
  }

  .card { background: #141418; border-radius: 12px; overflow: hidden; border: 1px solid #252530; }
  .card-label { padding: 0.75rem 1.1rem; font-size: 0.72rem; color: #8a8a98; border-bottom: 1px solid #252530; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; }
  .card-label span:last-child { text-align: right; }

  .poster { position: relative; width: 100%; aspect-ratio: 4 / 5; overflow: hidden; }
  .poster__bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: saturate(1.05); }
  .poster__overlay { position: absolute; inset: 0; }
  .poster__content { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 1.6rem; }

  /* ===================================================================
     SLIDE A — "LESS SCROLLING" SYSTEM (kept — the winner of the 3)
     Ref: hand-lettered bold marker caps, pure white, stacked declarative
     lines, tiny sans caption, photo supplies 100% of the color (no tint
     needed beyond a soft vignette for legibility). Font: Kalam (bold) —
     closest free match to the reference's chunky, slightly wobbly
     brush-marker caps. One color only: white. Simplicity IS the point,
     so no accent color competes with the message about "less noise."
  ==================================================================== */
  .sa .poster__bg {
    background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1200&auto=format&fit=crop');
    background-position: center 40%;
  }
  .sa .poster__overlay {
    background: radial-gradient(ellipse at center, rgba(10,20,10,0.05) 0%, rgba(8,16,8,0.35) 75%, rgba(6,12,6,0.55) 100%);
  }
  .sa .poster__content { justify-content: center; align-items: center; text-align: center; gap: 0.6rem; }
  .sa .line { font-family: 'Kalam', cursive; font-weight: 700; font-size: clamp(1.6rem, 8vw, 2.3rem); color: #fff; text-transform: uppercase; line-height: 1.1; text-shadow: 0 2px 10px rgba(0,0,0,0.45); }
  .sa .caption { margin-top: 1.4rem; font-family: 'Inter', sans-serif; font-size: 0.72rem; color: #f2f2ee; opacity: 0.85; line-height: 1.5; max-width: 20ch; }

</style>
</head>
<body>

<header>
  <h1>Carousel Reference Recreation</h1>
  <p>Hand-lettered minimal system — winner of the 3-way carousel style test</p>
</header>

<div class="gallery">

  <div class="card">
    <div class="card-label"><span>A — Hand-Lettered Minimal</span><span>white ink, no accent color</span></div>
    <div class="poster sa">
      <div class="poster__bg"></div>
      <div class="poster__overlay"></div>
      <div class="poster__content">
        <div class="line">Less scrolling.</div>
        <div class="line">More creating.</div>
        <div class="line">Simple.</div>
        <div class="caption">You've saved enough. Now it's time to create.</div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
