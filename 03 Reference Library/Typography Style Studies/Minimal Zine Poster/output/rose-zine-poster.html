<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>pressed still — zine poster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital@0;1&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%;
    background:#1c1c1c;
    display:flex; align-items:center; justify-content:center;
    font-family:'EB Garamond', serif;
  }

  .stage { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }

  .poster {
    position:relative;
    width:min(60vh, 90vw);
    aspect-ratio: 3 / 5;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(0,0,0,0.05), transparent 60%),
      radial-gradient(ellipse at 80% 85%, rgba(0,0,0,0.06), transparent 55%),
      #e9e2d3;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    overflow:hidden;
  }

  /* paper grain */
  .poster::before {
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-radial-gradient(circle at 10% 20%, rgba(0,0,0,0.025) 0, transparent 1px, transparent 3px),
      repeating-radial-gradient(circle at 70% 60%, rgba(0,0,0,0.02) 0, transparent 1px, transparent 4px);
    mix-blend-mode:multiply;
    pointer-events:none;
    z-index:5;
  }

  /* faint aging blotches */
  .poster::after {
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 12% 88%, rgba(120,100,60,0.10), transparent 35%),
      radial-gradient(circle at 92% 8%, rgba(120,100,60,0.08), transparent 30%),
      radial-gradient(circle at 55% 45%, rgba(0,0,0,0.03), transparent 50%);
    pointer-events:none;
    z-index:6;
  }

  /* specimen occupies the same optical slot as the sunflower hero */
  .specimen { position:absolute; inset:0; z-index:2; }
  .specimen svg { position:absolute; inset:0; width:100%; height:100%; }

  .headline {
    position:absolute; top:9%; left:9%; z-index:4;
    font-family:'EB Garamond', serif; font-style:italic; font-weight:400;
    font-size:clamp(14px, 3.6vh, 22px);
    color:#2a2a26; line-height:1.25; max-width:52%;
  }
  .caption {
    position:absolute; bottom:6.5%; right:9%; z-index:4;
    font-family:'Courier Prime', monospace;
    font-size:clamp(9px, 1.3vh, 11px);
    letter-spacing:0.06em; color:#5a5648; text-align:right; line-height:1.6; opacity:0.85;
  }
  .microtext {
    position:absolute; top:6%; right:9%; z-index:4;
    font-family:'Courier Prime', monospace;
    font-size:clamp(7px, 1vh, 9px);
    letter-spacing:0.08em; color:#8c8676; text-transform:uppercase;
  }
  .signature {
    position:absolute; bottom:4%; left:9%; z-index:4;
    font-family:'Courier Prime', monospace;
    font-size:clamp(7px, 0.9vh, 8px);
    color:#a39c88; letter-spacing:0.05em;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="poster">
    <div class="microtext">herbarium · no. 12</div>

    <div class="headline">what the<br>summer<br>kept</div>

    <div class="specimen">
      <svg viewBox="0 0 340 560" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs>
          <!-- paper tooth: fractalNoise -> diffuse lighting, multiplied over the sheet.
               surfaceScale kept low (1.6) so it reads as laid paper, not stucco. -->
          <filter id="paperTooth" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="5" seed="3" result="n"/>
            <feDiffuseLighting in="n" lighting-color="#ffffff" surfaceScale="1.6" diffuseConstant="1" result="lit">
              <feDistantLight azimuth="45" elevation="58"/>
            </feDiffuseLighting>
            <feColorMatrix in="lit" type="matrix"
              values="0 0 0 0 0.913  0 0 0 0 0.886  0 0 0 0 0.827  0 0 0 1 0" result="litTone"/>
            <feBlend in="SourceGraphic" in2="litTone" mode="multiply"/>
          </filter>

          <!-- torn ink edge.
               Two distinct physical scales: macro (0.011) = the wander of the tear line,
               micro (0.55) = cellulose fray. Composited arithmetically, then a
               morphological CLOSE (dilate -> slightly larger erode) removes the orphan
               specks displacement leaves behind. Filter region widened to 180% so the
               displaced contour is never clipped square. -->
          <filter id="tornInk" x="-40%" y="-40%" width="180%" height="180%">
            <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="9"  result="macro"/>
            <feTurbulence type="fractalNoise" baseFrequency="0.55"  numOctaves="2" seed="21" result="micro"/>
            <feComposite in="macro" in2="micro" operator="arithmetic"
                         k1="0" k2="0.68" k3="0.32" k4="0" result="combined"/>
            <feDisplacementMap in="SourceGraphic" in2="combined" scale="8"
                               xChannelSelector="R" yChannelSelector="G" result="displaced"/>
            <feMorphology in="displaced" operator="dilate" radius="0.6" result="c1"/>
            <feMorphology in="c1" operator="erode" radius="0.9"/>
          </filter>

          <!-- inner whorls: macro drift only. Petal interiors are creased, not torn. -->
          <filter id="tornInkSoft" x="-40%" y="-40%" width="180%" height="180%">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="14" result="m2"/>
            <feDisplacementMap in="SourceGraphic" in2="m2" scale="4.5"
                               xChannelSelector="R" yChannelSelector="G"/>
          </filter>

          <!-- stem: near-smooth, a stem is not a torn edge -->
          <filter id="stemWarp" x="-30%" y="-30%" width="160%" height="160%">
            <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="61" result="m3"/>
            <feDisplacementMap in="SourceGraphic" in2="m3" scale="3"
                               xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>

        <!-- paper plate sits underneath everything -->
        <g filter="url(#paperTooth)">
          <rect x="0" y="0" width="340" height="560" fill="#e9e2d3"/>
        </g>

        <path id="roseStem" fill="#5a3418" filter="url(#stemWarp)" opacity="0.92"/>
        <g id="roseGroup" filter="url(#tornInk)"></g>
        <g id="roseShadeGroup" filter="url(#tornInkSoft)"></g>
      </svg>
    </div>

    <div class="caption">pressed 09.14<br>dry, no scent</div>
    <div class="signature">no. 05</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // deterministic PRNG so the poster is identical on every reload (print deliverable)
  function seededRand(seed){
    var s = seed >>> 0;
    return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  // 2D superformula: r = f(phi). m controls lobe count -- m=5 gives a five-fold
  // petal whorl, which is what a rose head actually is. No amount of edge-warping
  // a blob produces lobes; they have to come from the geometry.
  function superformula(phi, a, b, m, n1, n2, n3){
    var t1 = Math.abs(Math.cos(m * phi / 4) / a);
    var t2 = Math.abs(Math.sin(m * phi / 4) / b);
    return Math.pow(Math.pow(t1, n2) + Math.pow(t2, n3), -1 / n1);
  }

  // Normalise so `targetMax` is the true maximum radius in px.
  // (Passing the scale straight through makes it the MINIMUM radius, which
  // silently overflows the frame by ~60% on lobed shapes.)
  function unitMaxRadius(m, n1, n2, n3){
    var mx = 0;
    for (var i = 0; i <= 1440; i++){
      var r = superformula(i / 1440 * Math.PI * 2, 1, 1, m, n1, n2, n3);
      if (isFinite(r) && r > mx) mx = r;
    }
    return mx || 1;
  }

  function superformulaPath(cx, cy, targetMax, m, n1, n2, n3, steps, jitter, rand, squashY){
    var k = targetMax / unitMaxRadius(m, n1, n2, n3);
    var d = '';
    for (var i = 0; i <= steps; i++){
      var phi = (i / steps) * Math.PI * 2;
      var r = superformula(phi, 1, 1, m, n1, n2, n3) * k;
      if (!isFinite(r)) continue;
      if (jitter) r *= (1 + (rand() - 0.5) * jitter);
      var x = cx + r * Math.cos(phi);
      var y = cy + r * Math.sin(phi) * (squashY || 1);
      d += (d ? 'L' : 'M') + x.toFixed(2) + ',' + y.toFixed(2) + ' ';
    }
    return d + 'Z';
  }

  var rand = seededRand(701);
  var cx = 170, cy = 232;

  // A rose is NOT a radial function. Superformula lobes read as a five-pointed
  // star no matter how they're tuned, because every lobe shares one centre and
  // one axis. A real bloom is a set of OVERLAPPING PETALS, each an off-centre
  // rounded form at its own angle, distance and size, occluding the ones behind.
  // So: build individual petals and stack them outer-rank -> inner-rank.

  // one petal: a closed rounded-teardrop, widest past its midpoint, drawn in
  // local space then rotated into place. Slight asymmetry (skew) per petal so
  // no two are identical.
  function petal(px, py, len, wid, angleDeg, skew, fill, op){
    var w = wid, l = len;
    var d =
      'M 0,0 ' +
      'C ' + (-w * (0.62 + skew)) + ',' + (-l * 0.18) + ' ' +
             (-w * (0.98 - skew)) + ',' + (-l * 0.62) + ' ' +
             (-w * 0.16) + ',' + (-l) + ' ' +
      'C ' + ( w * (0.42 + skew)) + ',' + (-l * 0.94) + ' ' +
             ( w * (0.98 + skew)) + ',' + (-l * 0.55) + ' ' +
             ( w * 0.58) + ',' + (-l * 0.16) + ' ' +
      'C ' + ( w * 0.34) + ',' + (-l * 0.05) + ' ' +
             ( w * 0.14) + ',' + ( l * 0.02) + ' 0,0 Z';
    return '<g transform="translate(' + px.toFixed(2) + ',' + py.toFixed(2) + ') rotate(' + angleDeg.toFixed(1) + ')">' +
           '<path d="' + d + '" fill="' + fill + '"' + (op ? ' opacity="' + op + '"' : '') + '/></g>';
  }

  // rank: petals seated on a ring of radius `seat`, splayed outward
  function rank(count, seat, len, wid, phase, fill, op, lenVar){
    var out = '';
    for (var i = 0; i < count; i++){
      var a = phase + (i / count) * 360 + (rand() - 0.5) * 10;
      var rad = a * Math.PI / 180;
      // seat point sits on the ring; petal points outward (rotate so local -Y = outward)
      var sx = cx + Math.cos(rad) * seat;
      var sy = cy + Math.sin(rad) * seat * 1.02;
      var L = len * (1 + (rand() - 0.5) * (lenVar || 0.18));
      var W = wid * (1 + (rand() - 0.5) * 0.16);
      out += petal(sx, sy, L, W, a + 90, (rand() - 0.5) * 0.22, fill, op);
    }
    return out;
  }

  // outer ranks = the lit face of the bloom (goes in the torn-edge group)
  var outerRanks =
    rank(7, 46, 78, 40, 8,   '#9c1c1c') +
    rank(6, 34, 60, 34, 32,  '#a52121');

  // inner ranks = the shaded funnel + tight core (softer filter, layered darker)
  // Inner ranks must stay LONG and NARROW. Short+wide petals rasterise as
  // pebbles, which is what makes a centre read as a cluster of berries rather
  // than a furl. Length is kept near the outer ranks; only the width collapses.
  var innerRanks =
    rank(6, 26, 58, 22, 14,  '#6e1010', 0.92, 0.12) +
    rank(5, 17, 48, 17, 46,  '#540c0c', 0.94, 0.10) +
    rank(4, 10, 38, 13, 22,  '#3d0808', 0.95, 0.10) +
    // furled centre: a tight spiral of narrow petals, no gap at the axis
    rank(3,  5, 28, 10, 62,  '#320707', 0.95, 0.08) +
    petal(cx + 1, cy + 2, 22, 9, 205, 0.18, '#2f0606', 0.96) +
    petal(cx - 1, cy - 1, 19, 8,  35, 0.14, '#280505', 0.96) +
    petal(cx,     cy + 1, 14, 7, 128, 0.10, '#230404', 0.97);

  document.getElementById('roseGroup').innerHTML = outerRanks;
  document.getElementById('roseShadeGroup').innerHTML = innerRanks;

  // stem: slight lean + taper, drawn as a tapered quad rather than a rect so it
  // reads as a dried stalk instead of a bar
  var topY = cy + 78, botY = 520, lean = 13;
  document.getElementById('roseStem').setAttribute('d',
    'M ' + (cx - 4.5) + ',' + topY +
    ' C ' + (cx - 6) + ',' + (topY + 120) + ' ' + (cx - 3 + lean) + ',' + (botY - 110) + ' ' + (cx + lean) + ',' + botY +
    ' L ' + (cx + lean + 4) + ',' + botY +
    ' C ' + (cx + 2 + lean) + ',' + (botY - 110) + ' ' + (cx + 2) + ',' + (topY + 120) + ' ' + (cx + 4.5) + ',' + topY + ' Z');
})();
</script>
</body>
</html>
